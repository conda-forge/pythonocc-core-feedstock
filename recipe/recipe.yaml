schema_version: 1

context:
  version: "8.0.1"
  # Builds up to and including the first 8.0.1 ones encoded the occt variant in
  # the build number (novtk -> +100, all -> +200). That matrix is gone, a single
  # build now works with either occt variant, so the build number has to start
  # above the highest number ever published.
  build: 201

package:
  name: pythonocc-core
  version: ${{ version }}

source:
  url: https://github.com/tpaviot/pythonocc-core/archive/${{ version }}.tar.gz
  sha256: 77345f333614374911d946a37bf89c3bbf2d285117d3d37b4197fcd28dc598a3

build:
  number: ${{ build }}

requirements:
  build:
    - if: build_platform != target_platform
      then: python
    - if: build_platform != target_platform
      then: numpy
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - ninja
    - cmake
    - swig
  host:
    - python
    # Deliberately unpinned to an occt variant: pythonocc-core links only OCCT
    # libraries that both the 'novtk' and the 'all' build of occt provide, so
    # which one ends up installed is the consumer's choice. See
    # https://github.com/conda-forge/pythonocc-core-feedstock/issues/27. The
    # version range is pinned for us by occt's run_exports (occt breaks ABI
    # between minor versions), the tests below check both variants.
    - occt
    - numpy
    - if: linux
      then: libgl-devel
    - if: linux
      then: xorg-libxi
  run:
    - python
    - svgwrite

tests:
  - python:
      imports:
        - OCC
        - OCC.Core.BRepPrimAPI
      pip_check: false

  # The upstream test suite is run twice, once per occt variant, to keep the
  # unpinned occt dependency above honest: should pythonocc-core ever start to
  # link a VTK-only OCCT library, the 'novtk' run fails. Both runs execute the
  # very same script, only the occt build resolved into the test environment
  # differs, and run_tests.py asserts it got the variant it was asked for.
  - script:
      - python run_tests.py novtk
    files:
      source:
        - test
      recipe:
        - run_tests.py
    requirements:
      run:
        - occt * *novtk*
        - pyqt >=5
        - pytest
        - mypy

  - script:
      - python run_tests.py all
    files:
      source:
        - test
      recipe:
        - run_tests.py
    requirements:
      run:
        - occt * *all*
        - pyqt >=5
        - pytest
        - mypy

about:
  license: LGPL-3.0-or-later
  license_file: LICENSE
  summary: python bindings for opencascade (occt)
  description: |
    pythonocc is a python package whose purpose is
    to provide 3D modeling features. It is intended
    to CAD/PDM/PLM and BIM related development.
  homepage: https://github.com/tpaviot/pythonocc-core
  repository: https://github.com/tpaviot/pythonocc-core

extra:
  recipe-maintainers:
    - oursland
    - krande
    - looooo
